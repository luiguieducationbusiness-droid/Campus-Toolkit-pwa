<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#14213D" />
  <meta name="description" content="Conversión de archivos, transcripción en vivo y herramientas de productividad para estudiantes universitarios. Funciona sin conexión y no requiere servidor propio." />
  <title>Campus Toolkit — Suite de estudiante</title>
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="bg-paper text-ink font-body antialiased">
  <div class="flex min-h-screen">
    <!-- Spine / navegación tipo carpeta -->
    <aside class="w-64 shrink-0 border-r border-line bg-white flex flex-col">
      <div class="px-5 pt-6 pb-5 border-b border-line">
        <p class="font-display text-2xl font-semibold leading-tight">Campus<br />Toolkit</p>
        <p class="text-xs text-graphite mt-1">Herramientas para tu ciclo académico</p>
      </div>
      <nav id="nav" class="flex-1 py-3 overflow-y-auto"></nav>
      <div class="px-5 py-4 border-t border-line text-xs text-graphite">
        <span id="online-badge" class="inline-flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-good"></span> Disponible sin conexión
        </span>
      </div>
    </aside>

    <!-- Contenido -->
    <main class="flex-1 bg-grid bg-grid" style="background-size:28px 28px">
      <div id="view" class="max-w-3xl mx-auto px-6 py-10 sm:px-10"></div>
    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
